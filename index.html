<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#101210; --elevated:#181b19; --surface:#1c201d;
    --fg:#f3f0e8; --muted:#a39d92; --faint:#8a847a;
    --primary:#f08a3e; --primary-hover:#ff9d55; --primary-fg:#1c1108;
    --border:#2e332f;
    --font-sans:'Outfit', system-ui, sans-serif;
    --font-display:'Syne', system-ui, sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#f4f1ea; --elevated:#fffdf8; --surface:#fffcf7;
    --fg:#171611; --muted:#5c574e; --faint:#625d54;
    --primary:#b3470e; --primary-hover:#9a3d0c; --primary-fg:#fff7f1;
    --border:#e2dbd0;
    color-scheme: light;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; scroll-padding-top:88px;}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    transition:background-color .35s ease, color .35s ease;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  svg.ico{display:block; flex-shrink:0;}
  ::selection{background:var(--primary); color:var(--primary-fg);}
  :focus-visible{outline:2px solid var(--primary); outline-offset:3px;}

  .ambient{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(40rem 32rem at 0% -10%, color-mix(in srgb, var(--primary) 26%, transparent), transparent 68%),
      radial-gradient(34rem 28rem at 100% 0%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 62%);
  }
  .glass{
    background:color-mix(in srgb, var(--elevated) 58%, transparent);
    box-shadow:inset 0 1px 0 color-mix(in srgb, var(--fg) 10%, transparent);
    backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  }
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1; transform:none;}
  @media(prefers-reduced-motion:reduce){*{transition:none !important; scroll-behavior:auto !important;} .reveal{opacity:1; transform:none;}}

  main{max-width:1120px; margin:0 auto; padding:0 20px;}
  @media(min-width:640px){main{padding:0 32px;}}

  /* ===== loading skeleton ===== */
  #loader{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; padding:120px 20px 0;
    transition:opacity .4s ease; gap:16px;
  }
  #loader.hide{opacity:0; pointer-events:none;}
  .sk{
    border-radius:10px; width:100%; max-width:640px;
    background:linear-gradient(100deg, var(--surface) 30%, var(--elevated) 50%, var(--surface) 70%);
    background-size:200% 100%; animation:shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .sk-title{height:48px; max-width:360px;}
  .sk-line{height:16px; max-width:460px; margin-top:4px;}
  .sk-row{display:flex; gap:12px; margin-top:28px; width:100%; max-width:640px;}
  .sk-card{height:140px; flex:1; border-radius:18px;}
  @media(prefers-reduced-motion:reduce){.sk{animation:none;}}

  /* header */
  header{
    position:fixed; inset-inline:0; top:0; z-index:40;
    border-bottom:1px solid var(--border); border-top:2px solid var(--primary);
    padding-top:env(safe-area-inset-top,0px);
  }
  .header-inner{
    max-width:1120px; margin:0 auto; height:64px; padding:0 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  @media(min-width:640px){.header-inner{padding:0 32px;}}
  .brand{display:flex; align-items:center; gap:12px; color:var(--fg); text-decoration:none;}
  .brand-mark{
    width:36px; height:36px; border-radius:10px; background:var(--primary);
    display:grid; place-items:center; font-family:var(--font-display); font-weight:700;
    font-size:.85rem; color:var(--primary-fg);
  }
  .brand-name{font-family:var(--font-display); font-weight:600; font-size:1rem;}
  nav.links{display:none; align-items:center; gap:28px;}
  @media(min-width:768px){nav.links{display:flex;}}
  nav.links a{color:var(--muted); text-decoration:none; font-size:.9rem; font-weight:500; transition:color .2s ease;}
  nav.links a[aria-current="true"]{color:var(--fg);}
  nav.links a:hover{color:var(--fg);}
  .header-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:44px; height:44px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--fg); display:grid; place-items:center;
    transition:background .2s ease, transform .2s ease;
  }
  .icon-btn:hover{background:var(--elevated);}
  .icon-btn:active{transform:scale(.94);}
  .lang-btn{
    width:44px; height:44px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--fg); display:grid; place-items:center;
    font-size:.78rem; font-weight:700; letter-spacing:.02em;
    transition:background .2s ease, transform .2s ease;
  }
  .lang-btn:hover{background:var(--elevated);}
  .lang-btn:active{transform:scale(.94);}
  .menu-btn{display:grid;}
  @media(min-width:768px){.menu-btn{display:none;}}
  .theme-icon-moon{display:none;}
  [data-theme="light"] .theme-icon-sun{display:none;} [data-theme="light"] .theme-icon-moon{display:block;}

  .mobile-menu{position:fixed; inset:0; z-index:50; display:none;}
  .mobile-menu.open{display:block;}
  .mobile-menu .backdrop{position:absolute; inset:0; background:color-mix(in srgb, var(--fg) 30%, transparent); border:none;}
  .mobile-menu .panel{
    position:absolute; top:0; right:0; height:100dvh; width:min(100%,22rem);
    background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(18px);
    border-left:1px solid var(--border); padding:32px; padding-top:calc(32px + env(safe-area-inset-top,0px));
    display:flex; flex-direction:column;
  }
  .mobile-menu .close-row{display:flex; justify-content:flex-end; margin-bottom:40px;}
  .mobile-menu .panel a{
    font-family:var(--font-display); font-size:1.8rem; font-weight:600; color:var(--fg);
    text-decoration:none; padding:14px 0;
  }

  /* hero */
  .hero{padding-top:112px; padding-bottom:64px;}
  @media(min-width:1024px){.hero{padding-top:128px; padding-bottom:80px;}}
  .hero-grid{display:grid; gap:48px;}
  @media(min-width:1024px){.hero-grid{grid-template-columns:minmax(0,1fr) 17rem; gap:64px; align-items:start;}}
  .eyebrow{font-size:.85rem; font-weight:500; letter-spacing:.14em; color:var(--primary); text-transform:uppercase;}
  .hero h1{font-size:clamp(2.6rem,9vw,5.5rem); line-height:.92; font-weight:600; margin-top:18px;}
  .hero blockquote{margin-top:30px; max-width:36rem; border-left:2px solid var(--primary); padding-left:20px;}
  .hero blockquote p{font-family:var(--font-display); font-size:clamp(1.1rem,3vw,1.4rem); line-height:1.35; font-style:normal;}
  .hero-actions{margin-top:36px; display:flex; flex-wrap:wrap; gap:12px;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 22px;
    border-radius:999px; font-weight:600; font-size:.92rem; text-decoration:none; border:none;
    transition:background .2s ease, transform .2s ease, color .2s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--primary); color:var(--primary-fg);}
  .btn-primary:hover{background:var(--primary-hover);}
  .btn-ghost{background:transparent; color:var(--fg); border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface);}

  .studio-card{padding:20px; border-radius:18px; border:1px solid var(--border);}
  .studio-card p.label{font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);}
  .studio-list{margin-top:18px; border-top:1px solid var(--border);}
  .studio-list a{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    border-bottom:1px solid var(--border); padding:13px 0; text-decoration:none; color:var(--fg);
  }
  .studio-list .idx{font-family:var(--font-display); font-size:.72rem; color:var(--faint);}
  .studio-list .ttl{font-weight:500; font-size:.92rem;}
  .studio-list .dot{width:6px; height:6px; border-radius:50%; background:var(--faint); flex-shrink:0;}
  .studio-list .dot.live{background:var(--primary);}

  .principles{border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:40px 0;}
  .principles ol{display:grid; gap:24px; list-style:none;}
  @media(min-width:768px){.principles ol{grid-template-columns:repeat(3,1fr);}}
  .principles li{padding:20px; border-radius:18px; border:1px solid var(--border);}
  .principles .idx{font-family:var(--font-display); font-size:.75rem; color:var(--primary);}
  .principles h3{margin-top:10px; font-size:1.1rem; font-weight:600;}
  .principles p{margin-top:8px; font-size:.88rem; line-height:1.5; color:var(--muted);}

  section{padding:80px 0;}
  @media(min-width:768px){section{padding:96px 0;}}
  .section-head h2{font-size:clamp(1.9rem,5vw,2.8rem); font-weight:600; margin-top:10px;}
  .section-sub{margin-top:10px; font-size:.88rem; color:var(--muted);}

  .proj-top{display:flex; flex-direction:column; gap:20px;}
  @media(min-width:640px){.proj-top{flex-direction:row; align-items:flex-end; justify-content:space-between;}}
  .filters{display:flex; flex-wrap:wrap; gap:8px;}
  .filter-btn{
    height:44px; padding:0 18px; border-radius:999px; font-size:.88rem; font-weight:600;
    border:1px solid var(--border); background:transparent; color:var(--muted);
  }
  .filter-btn.active{background:var(--primary); color:var(--primary-fg); border-color:var(--primary);}
  .filter-btn:not(.active):hover{color:var(--fg);}

  .featured-wrap{margin-top:32px; display:flex; flex-direction:column; gap:16px;}
  .featured-card{
    display:grid; gap:0; border-radius:22px; border:1px solid var(--border);
    overflow:hidden; text-align:left; width:100%; color:var(--fg);
    transition:border-color .2s ease, transform .2s ease;
  }
  .featured-card:hover{border-color:var(--primary); transform:translateY(-2px);}
  @media(min-width:860px){.featured-card{grid-template-columns:1.1fr 1fr;}}
  .featured-media{
    aspect-ratio:16/10; overflow:hidden; background:var(--surface); position:relative;
  }
  @media(min-width:860px){.featured-media{aspect-ratio:auto; height:100%;}}
  .featured-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .featured-badge{
    position:absolute; top:14px; left:14px; background:var(--primary); color:var(--primary-fg);
    font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:6px 12px; border-radius:999px;
  }
  .featured-body{padding:26px 24px 28px; display:flex; flex-direction:column; gap:14px;}
  @media(min-width:640px){.featured-body{padding:34px;}}
  .featured-body h3{font-size:clamp(1.6rem,4vw,2.1rem); font-weight:600;}
  .featured-body p.desc{color:var(--muted); font-size:.96rem; line-height:1.6;}
  .featured-body .tags{margin-top:2px;}
  .featured-body .proj-link{margin-top:6px;}

  .proj-grid{margin-top:20px; display:grid; gap:16px;}
  @media(min-width:640px){.proj-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1200px){.proj-grid{grid-template-columns:repeat(3,1fr);}}

  .proj-card{
    border-radius:18px; border:1px solid var(--border); padding:24px;
    display:flex; flex-direction:column; gap:14px; text-align:left; width:100%;
    transition:border-color .2s ease, transform .2s ease; color:var(--fg);
  }
  .proj-card:hover{border-color:var(--primary); transform:translateY(-2px);}
  .proj-top-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .proj-icon{width:44px; height:44px; border-radius:12px; background:color-mix(in srgb, var(--primary) 15%, transparent); color:var(--primary); display:grid; place-items:center; overflow:hidden; flex-shrink:0;}
  .proj-icon img{width:100%; height:100%; object-fit:cover; display:block;}
  .proj-type{font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:600;}
  .proj-card h3{font-size:1.5rem; font-weight:600;}
  .proj-card p.desc{color:var(--muted); font-size:.92rem; line-height:1.55; flex:1;}
  .proj-status{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:600; width:fit-content;}
  .proj-status .dot{width:7px; height:7px; border-radius:50%;}
  .proj-status.live{color:var(--primary);} .proj-status.live .dot{background:var(--primary);}
  .proj-status.dev{color:var(--faint);} .proj-status.dev .dot{background:var(--faint);}
  .tags{display:flex; flex-wrap:wrap; gap:8px;}
  .tag{font-size:.74rem; color:var(--muted); border:1px solid var(--border); padding:4px 11px; border-radius:999px;}
  .proj-link{display:inline-flex; align-items:center; gap:6px; height:40px; width:fit-content; font-size:.88rem; font-weight:600; color:var(--primary); text-decoration:none;}
  .proj-link svg{transition:transform .2s ease;}
  .proj-link:hover svg{transform:translate(2px,-2px);}
  .proj-soon{font-size:.88rem; font-weight:500; color:var(--faint); height:40px; display:flex; align-items:center;}

  .about-grid{margin-top:36px; display:grid; gap:36px;}
  @media(min-width:1024px){.about-grid{grid-template-columns:1.2fr .8fr;}}
  .about-grid p{max-width:60ch; font-size:1rem; line-height:1.7; color:var(--muted);}
  .about-grid p + p{margin-top:14px;}
  .stat-grid{display:grid; gap:14px;}
  @media(min-width:640px) and (max-width:1023px){.stat-grid{grid-template-columns:1fr 1fr;}}
  .stat-card{border-radius:18px; border:1px solid var(--border); padding:22px;}
  .stat-card dt{font-size:.88rem; color:var(--muted);}
  .stat-card dd{margin-top:8px; font-family:var(--font-display); font-size:2.2rem; font-weight:600; color:var(--primary);}

  .contact-card{border-radius:26px; border:1px solid var(--border); padding:40px 24px; position:relative; overflow:hidden;}
  @media(min-width:640px){.contact-card{padding:56px 48px;}}
  .contact-card h2{font-size:clamp(1.8rem,5vw,2.6rem); font-weight:600;}
  .contact-card p{margin-top:14px; max-width:34rem; color:var(--muted); line-height:1.6;}
  .contact-actions{margin-top:30px; display:flex; flex-wrap:wrap; gap:12px;}

  footer{border-top:1px solid var(--border); padding:32px 20px; text-align:center; font-size:.85rem; color:var(--faint); padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));}

  #backTop{
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:30;
    width:48px; height:48px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--fg); display:grid; place-items:center;
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity .25s ease, transform .25s ease, background .2s ease;
  }
  #backTop.show{opacity:1; pointer-events:auto; transform:none;}
  #backTop:hover{background:var(--elevated);}

  .modal-overlay{
    position:fixed; inset:0; z-index:60; display:none;
    background:color-mix(in srgb, #000 55%, transparent);
    align-items:flex-end; justify-content:center; padding:0;
  }
  .modal-overlay.open{display:flex;}
  @media(min-width:640px){.modal-overlay{align-items:center; padding:24px;}}
  .modal{
    background:var(--elevated); border:1px solid var(--border);
    width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    border-radius:24px 24px 0 0; padding:28px 24px; padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
    transform:translateY(24px); opacity:0; transition:transform .3s ease, opacity .3s ease;
  }
  @media(min-width:640px){.modal{border-radius:24px; padding:32px;}}
  .modal-overlay.open .modal{transform:none; opacity:1;}
  .modal-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  .modal-icon{width:52px; height:52px; border-radius:14px; background:color-mix(in srgb, var(--primary) 15%, transparent); color:var(--primary); display:grid; place-items:center;}
  .modal-close{width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--fg); display:grid; place-items:center; flex-shrink:0;}
  .modal h3{margin-top:18px; font-size:1.8rem; font-weight:600;}
  .modal .modal-status{margin-top:8px;}
  .modal-shot{
    margin-top:20px; aspect-ratio:16/9; border-radius:14px; border:1px dashed var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:var(--faint); font-size:.82rem; background:var(--surface); overflow:hidden;
  }
  .modal-shot.has-img{border-style:solid; padding:0;}
  .modal-shot.has-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .modal p.full-desc{margin-top:20px; color:var(--muted); line-height:1.65; font-size:.96rem;}
  .modal .tags{margin-top:18px;}
  .modal-actions{margin-top:24px; display:flex; flex-wrap:wrap; gap:12px;}
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <div class="sk sk-title"></div>
  <div class="sk sk-line" style="width:90%;max-width:520px;"></div>
  <div class="sk-row">
    <div class="sk sk-card"></div>
    <div class="sk sk-card"></div>
    <div class="sk sk-card"></div>
  </div>
</div>

<div class="ambient"></div>

<header class="glass">
  <div class="header-inner">
    <a href="#inicio" class="brand">
      <span class="brand-mark">RE</span>
      <span class="brand-name">Romi Estudio</span>
    </a>
    <nav class="links" id="navLinks" aria-label="Secciones">
      <a href="#inicio" data-nav="inicio"></a>
      <a href="#proyectos" data-nav="proyectos"></a>
      <a href="#sobre-mi" data-nav="sobre-mi"></a>
      <a href="#contacto" data-nav="contacto"></a>
    </nav>
    <div class="header-actions">
      <button class="lang-btn" id="langToggle"></button>
      <button class="icon-btn" id="themeToggle">
        <svg class="ico theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="ico theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>

      stats:(p,c)=>`${p} published · ${c} in progress`,
      filterAll:"All", filterApps:"Apps", filterWeb:"Web",
      featuredBadge:"Featured",
      statusLive:"Live", statusDev:"In development", soon:"Coming soon",
      linkDownload:"Download", linkVisit:"Visit",
      profileEyebrow:"Profile", aboutHeading:"About me",
      aboutP1:"I design and build web apps meant to solve real problems, with attention to detail in every interaction.",
      aboutP2:"Every project under Romi Estudio has its own visual identity, but shares one way of working: clean code, modern interfaces, and production-ready solutions.",
      statProjectsLabel:"Projects", statIndependentLabel:"Independent",
      contactEyebrow:"Contact", contactHeading:"Let's talk",
      contactP:"Have a project in mind or want to know more about an app? Reach out.",
      emailBtn:"Send email", modalShotText:"Screenshot coming soon", modalSoon:"Available soon",
      footer:(y)=>`© ${y} Romi Estudio. Every project, in one place.`,
      langNext:"ES"
    }
  };

  let lang = 'es';
  try { const saved = localStorage.getItem('romi-lang'); if (saved === 'es' || saved === 'en') lang = saved; } catch(e) {}

  const ICON = {
    smartphone:'<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>',
    globe:'<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z"/></svg>',
    arrow:'<svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>'
  };
  const icon = (type) => type === 'app' ? ICON.smartphone : ICON.globe;
  const thumb = (p) => p.image ? `<img src="${p.image}" alt="" loading="lazy">` : icon(p.type);
  let currentFilter = 'todos';

  function t(key){ return STR[lang][key]; }

  function renderStudioList(){
    const el = document.getElementById('studioList');
    el.innerHTML = '';
    projects.forEach((p,i) => {
      const a = document.createElement('a');
      a.href = `#${p.slug}`;
      a.innerHTML = `<span style="display:flex;align-items:baseline;gap:12px;min-width:0;">
          <span class="idx">${String(i+1).padStart(2,'0')}</span>
          <span class="ttl">${p.title}</span>
        </span><span class="dot ${p.href ? 'live' : ''}"></span>`;
      el.appendChild(a);
    });
  }

  function renderPrinciples(){
    const el = document.getElementById('principlesList');
    el.innerHTML = '';
    principles.forEach((p,i) => {
      const li = document.createElement('li');
      li.className = 'reveal in';
      li.innerHTML = `<p class="idx">${String(i+1).padStart(2,'0')}</p><h3>${p[lang].title}</h3><p>${p[lang].text}</p>`;
      el.appendChild(li);
    });
  }

  function updateStats(){
    const published = projects.filter(p => p.href).length;
    document.getElementById('projStats').textContent = t('stats')(published, projects.length - published);
    document.getElementById('statProjects').textContent = projects.length;
  }

  function renderFeatured(){
    const wrap = document.getElementById('featuredWrap');
    const list = projects.filter(x => x.featured);
    if(!list.length){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = list.map(p => {
      const d = p[lang];
      return `
      <button type="button" class="featured-card glass" data-slug="${p.slug}">
        <span class="featured-media">
          ${p.image ? `<img src="${p.image}" alt="${p.title}" loading="lazy">` : ''}
          <span class="featured-badge">${t('featuredBadge')}</span>
        </span>
        <span class="featured-body">
          <span class="proj-type">${p.type}</span>
          <h3>${p.title}</h3>
          <p class="desc">${d.description}</p>
          <span class="proj-status ${p.href ? 'live' : 'dev'}"><span class="dot"></span>${p.href ? t('statusLive') : t('statusDev')}</span>
          <span class="tags">${d.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</span>
          ${p.href
            ? `<span class="proj-link">${p.type === 'app' ? t('linkDownload') : t('linkVisit')} ${ICON.arrow}</span>`
            : `<span class="proj-soon">${t('soon')}</span>`}
        </span>
      </button>`;
    }).join('');
    wrap.querySelectorAll('.featured-card').forEach(btn => {
      const p = list.find(x => x.slug === btn.dataset.slug);
      btn.addEventListener('click', () => openModal(p));
    });
  }

  function renderGrid(){
    const grid = document.getElementById('projGrid');
    grid.innerHTML = '';
    const visible = projects.filter(p => !p.featured && (currentFilter === 'todos' || p.type === currentFilter));
    visible.forEach(p => {
      const d = p[lang];
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'proj-card glass reveal in';
      card.dataset.slug = p.slug;
      card.innerHTML = `
        <div class="proj-top-row">
          <div class="proj-icon">${thumb(p)}</div>
          <span class="proj-type">${p.type}</span>
        </div>
        <h3>${p.title}</h3>
        <p class="desc">${d.description}</p>
        <span class="proj-status ${p.href ? 'live' : 'dev'}"><span class="dot"></span>${p.href ? t('statusLive') : t('statusDev')}</span>
        <div class="tags">${d.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
        ${p.href
          ? `<span class="proj-link">${p.type === 'app' ? t('linkDownload') : t('linkVisit')} ${ICON.arrow}</span>`
          : `<span class="proj-soon">${t('soon')}</span>`}
      `;
      card.addEventListener('click', () => openModal(p));
      grid.appendChild(card);
    });
  }

  const overlay = document.getElementById('modalOverlay');
  function openModal(p){
    const d = p[lang];
    document.getElementById('modalIcon').innerHTML = icon(p.type);
    document.getElementById('modalTitle').textContent = p.title;
    document.getElementById('modalStatus').innerHTML =
      `<span class="proj-status ${p.href ? 'live' : 'dev'}"><span class="dot"></span>${p.href ? t('statusLive') : t('statusDev')}</span>`;
    const shotEl = document.getElementById('modalShot');
    if(p.image){
      shotEl.classList.add('has-img');
      shotEl.innerHTML = `<img src="${p.image}" alt="${p.title}" loading="lazy">`;
    } else {
      shotEl.classList.remove('has-img');
      shotEl.innerHTML = `
        <svg class="ico" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        <span>${t('modalShotText')}</span>`;
    }
    document.getElementById('modalDesc').textContent = d.fullDescription;
    document.getElementById('modalTags').innerHTML = d.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
    document.getElementById('modalActions').innerHTML = p.href
      ? `<a class="btn btn-primary" href="${p.href}" target="_blank" rel="noopener">${p.type === 'app' ? t('linkDownload') : t('linkVisit')} ${ICON.arrow}</a>`
      : `<span class="proj-soon">${t('modalSoon')}</span>`;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  function applyStaticText(){
    document.documentElement.lang = lang;
    document.getElementById('heroEyebrow').textContent = t('eyebrow');
    document.getElementById('heroQuote').textContent = t('heroQuote');
    document.getElementById('btnViewProjects').textContent = t('viewProjects');
    document.getElementById('btnContact').textContent = t('contactBtn');
    document.getElementById('studioLabel').textContent = t('studioLabel');
    document.querySelector('[data-nav="inicio"]').textContent = t('navInicio');
    document.querySelector('[data-nav="proyectos"]').textContent = t('navProyectos');
    document.querySelector('[data-nav="sobre-mi"]').textContent = t('navSobre');
    document.querySelector('[data-nav="contacto"]').textContent = t('navContacto');
    document.querySelector('[data-nav-m="inicio"]').textContent = t('navInicio');
    document.querySelector('[data-nav-m="proyectos"]').textContent = t('navProyectos');
    document.querySelector('[data-nav-m="sobre-mi"]').textContent = t('navSobre');
    document.querySelector('[data-nav-m="contacto"]').textContent = t('navContacto');
    document.getElementById('workEyebrow').textContent = t('workEyebrow');
    document.getElementById('projectsHeading').textContent = t('projectsHeading');
    document.querySelector('[data-filter="todos"]').textContent = t('filterAll');
    document.querySelector('[data-filter="app"]').textContent = t('filterApps');
    document.querySelector('[data-filter="web"]').textContent = t('filterWeb');
    document.getElementById('profileEyebrow').textContent = t('profileEyebrow');
    document.getElementById('aboutHeading').textContent = t('aboutHeading');
    document.getElementById('aboutP1').textContent = t('aboutP1');
    document.getElementById('aboutP2').textContent = t('aboutP2');
    document.getElementById('statProjectsLabel').textContent = t('statProjectsLabel');
    document.getElementById('statIndependentLabel').textContent = t('statIndependentLabel');
    document.getElementById('contactEyebrow').textContent = t('contactEyebrow');
    document.getElementById('contactHeading').textContent = t('contactHeading');
    document.getElementById('contactP').textContent = t('contactP');
    document.getElementById('emailBtnText').textContent = t('emailBtn');
    document.getElementById('igBtnText').textContent = '@' + contact.instagramHandle;
    document.getElementById('footerText').textContent = t('footer')(new Date().getFullYear());
    document.getElementById('langToggle').textContent = t('langNext');

    const ariaMap = {
      es:{theme:'Cambiar tema', menu:'Abrir menú', close:'Cerrar menú', backTop:'Volver arriba', lang:'Cambiar a inglés'},
      en:{theme:'Toggle theme', menu:'Open menu', close:'Close menu', backTop:'Back to top', lang:'Switch to Spanish'}
    };
    const a = ariaMap[lang];
    document.getElementById('themeToggle').setAttribute('aria-label', a.theme);
    document.getElementById('menuBtn').setAttribute('aria-label', a.menu);
    document.getElementById('menuClose').setAttribute('aria-label', a.close);
    document.getElementById('backTop').setAttribute('aria-label', a.backTop);
    document.getElementById('langToggle').setAttribute('aria-label', a.lang);
  }

  function renderAll(){
    applyStaticText();
    renderStudioList();
    renderPrinciples();
    updateStats();
    renderFeatured();
    renderGrid();
  }
  renderAll();

  document.getElementById('langToggle').addEventListener('click', () => {
    lang = lang === 'es' ? 'en' : 'es';
    try { localStorage.setItem('romi-lang', lang); } catch(e) {}
    renderAll();
  });

  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });

  document.getElementById('emailLink').href = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(contact.email)}`;
  document.getElementById('igLink').href = contact.instagram;

  const mobileMenu = document.getElementById('mobileMenu');
  const menuBtn = document.getElementById('menuBtn');
  function openMenu(){ mobileMenu.classList.add('open'); menuBtn.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; }
  function closeMenu(){ mobileMenu.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
  menuBtn.addEventListener('click', openMenu);
  document.getElementById('menuBackdrop').addEventListener('click', closeMenu);
  document.getElementById('menuClose').addEventListener('click', closeMenu);
  mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closeMenu(); } });

  const root = document.documentElement;
  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#f4f1ea' : '#101210');
    try { localStorage.setItem('romi-theme', theme); } catch(e) {}
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('romi-theme'); } catch(e) {}
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (prefersLight ? 'light' : 'dark'));
  document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  const navLinks = document.querySelectorAll('[data-nav]');
  const sections = ['inicio','proyectos','sobre-mi','contacto'].map(id => document.getElementById(id)).filter(Boolean);
  const sectionIO = new IntersectionObserver((entries) => {
    const visible = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (visible && visible.target.id) {
      navLinks.forEach(a => a.removeAttribute('aria-current'));
      const match = document.querySelector(`[data-nav="${visible.target.id}"]`);
      if (match) match.setAttribute('aria-current','true');
    }
  }, { rootMargin:'-30% 0px -55% 0px', threshold:[0.15,0.4,0.7] });
  sections.forEach(s => sectionIO.observe(s));

  const revealIO = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } });
  }, { threshold:0.12 });
  document.querySelectorAll('.reveal').forEach(el => revealIO.observe(el));

  const backTop = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    backTop.classList.toggle('show', window.scrollY > 500);
  }, { passive:true });
  backTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

  // Loading skeleton: oculta cuando cargan las fuentes (o a los 900ms como máximo)
  const loader = document.getElementById('loader');
  function hideLoader(){
    if (!loader || loader.classList.contains('hide')) return;
    loader.classList.add('hide');
    document.body.style.overflow = '';
    setTimeout(() => loader.remove(), 450);
  }
  document.body.style.overflow = 'hidden';
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.race([
    fontsReady,
    new Promise(resolve => setTimeout(resolve, 900))
  ]).then(hideLoader);
  setTimeout(hideLoader, 1400);

})();
</script>

</body>
</html>
